[package]
name = "rag-remote"
version = "0.1.0"
edition = "2024"

[dependencies]
agent-core = { path = "../agent-core" }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
async-trait = "0.1"
