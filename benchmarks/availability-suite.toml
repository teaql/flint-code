# DGX Spark Model Availability Evaluation Suite
# Tests nemotron-3-super on core Coding Agent workflows

[suite]
name = "availability-eval"
description = "First-phase DGX Spark model availability evaluation"
version = "1.0"

[[cases]]
name = "simple-greeting"
task = "benchmarks/tasks/simple-greeting"
workflow = "ksml-modeling"
expect = "completed"
timeout_secs = 600

[[cases]]
name = "school-service-3obj"
task = "benchmarks/tasks/school-service"
workflow = "ksml-modeling"
expect = "completed"
timeout_secs = 600

[[cases]]
name = "context-overflow-reject"
task = "benchmarks/tasks/context-overflow-test"
workflow = "ksml-modeling"
expect = "preflight_rejected"
timeout_secs = 30
